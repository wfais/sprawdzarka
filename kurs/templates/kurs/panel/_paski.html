<div class="liczniki">
  {% for s, n in p.paski %}<a class="licznik{% if filtr == s.klucz %} aktywny{% endif %}" href="{% url 'panel:przydzial' p.pk %}?stan={{ s.klucz }}" title="{{ s.opis }}"><i class="dioda {{ s.dioda }}" aria-hidden="true"></i><b>{{ n }}</b> {{ s.etykieta }}</a>{% endfor %}
  {% if p.testy %}<a class="licznik alarm{% if filtr == 'testy' %} aktywny{% endif %}" href="{% url 'panel:przydzial' p.pk %}?stan=testy" title="studenci, którzy zmienili pliki testów"><b>{{ p.testy }}</b> zmienione testy</a>{% endif %}
  {% if not p.lacznie %}<span class="slabe male">nikt jeszcze nie zaakceptował</span>{% endif %}
</div>
