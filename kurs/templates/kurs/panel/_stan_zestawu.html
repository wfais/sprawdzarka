<span class="stan-zestawu {{ p.stan.dioda }}" title="{{ p.stan.opis }}{% if p.do_oceny %} Do oceny: {{ p.do_oceny }}.{% endif %}"><i class="dioda {{ p.stan.dioda }}{% if p.stan.klucz == 'zalegle' %} pulsuje{% endif %}" aria-hidden="true"></i>{{ p.stan.etykieta }}{% if p.stan.klucz == 'nieopublikowany' %} {{ p.publikacja|date:"d.m H:i" }}{% elif p.stan.klucz == 'do_oceny' or p.stan.klucz == 'zalegle' %}: {{ p.do_oceny }}{% endif %}</span>
