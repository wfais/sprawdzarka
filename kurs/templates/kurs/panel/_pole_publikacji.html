<details class="pozniejsza-publikacja"{% if field.errors or field.value %} open{% endif %}>
  <summary>Ustaw późniejszą publikację (bez niej link działa od razu)</summary>
  {% if field.label %}{{ field.label_tag }}{% endif %}
  {% if field.help_text %}<div class="helptext"{% if field.auto_id %} id="{{ field.auto_id }}_helptext"{% endif %}>{{ field.help_text|safe }}</div>{% endif %}
  {{ field.errors }}
  {{ field }}
</details>
